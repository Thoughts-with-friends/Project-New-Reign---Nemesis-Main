[package]
name = "nemesis_egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "egui front-end for the Nemesis Unlimited Behavior Engine"
publish = false

[[bin]]
name = "Nemesis_Egui"
path = "src/main.rs"

[dependencies]
eframe = "0.35"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
